server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 35m;

  # API proxy
  location /api/ {
    proxy_pass http://backend:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 30s;
  }

  # WebSocket proxy
  location /ws/ {
    proxy_pass http://backend:5000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Media files
  location /media/ {
    proxy_pass http://backend:5000/media/;
  }

  # Service worker — never cache it
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
  }

  # manifest.json — correct MIME type, never cache
  location = /manifest.json {
    add_header Content-Type "application/manifest+json";
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Workbox runtime chunks (sw.js, workbox-*.js)
  location ~* workbox.*\.js$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Static assets — long cache (Vite adds hashes)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback — all routes serve index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
