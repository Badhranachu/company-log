services:
  db:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: companylog
      MYSQL_USER: companylog
      MYSQL_PASSWORD: companylog123

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped

    env_file:
      - ./backend/.env.example

    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/staticfiles

    ports:
      - "6060:5000"

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend

      args:
        VITE_API_URL: http://localhost:6060/api/v1
        VITE_WS_URL: ws://localhost:6060

    restart: unless-stopped

    ports:
      - "5055:80"

    depends_on:
      - backend

volumes:
  mysql_data:
  media_data:
  static_data:
