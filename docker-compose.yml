version: "3.9"

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: companylog
      MYSQL_USER: companylog
      MYSQL_PASSWORD: companylog123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.example
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://76.13.241.37:5000/api/v1
        VITE_WS_URL: ws://76.13.241.37:5000
    ports:
      - "5050:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  media_data:
